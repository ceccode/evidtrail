name: evidtrail Analyze

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  analyze:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run evidtrail (full history on main)
        if: github.event_name == 'push'
        run: |
          node packages/cli/dist/index.js collect --out-dir ./.evidtrail --redact-authors
          node packages/cli/dist/index.js analyze --out-dir ./.evidtrail
          node packages/cli/dist/index.js report --out-dir ./.evidtrail

      - name: Run evidtrail (PR-scoped)
        if: github.event_name == 'pull_request'
        run: |
          node packages/cli/dist/index.js collect --pr --out-dir ./.evidtrail --redact-authors
          node packages/cli/dist/index.js analyze --out-dir ./.evidtrail
          node packages/cli/dist/index.js report --out-dir ./.evidtrail

      # Keep the write-capable token away from code built from the PR. The
      # report is posted by GitHub's preinstalled CLI in its own narrow step.
      - name: Post evidtrail report to PR
        if: github.event_name == 'pull_request'
        run: |
          marker='<!-- evidtrail-report -->'
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | startswith("<!-- evidtrail-report -->") or startswith("<!-- aida-metrics-report -->")) | .id' | head -n 1)
          payload=$(jq -Rs --arg marker "$marker" '{body: ($marker + "\n" + .)}' < ./.evidtrail/report.md)
          if [ -n "$comment_id" ]; then
            printf '%s' "$payload" | gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" --input -
          else
            printf '%s' "$payload" | gh api --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --input -
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Upload evidtrail artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidtrail-report
          include-hidden-files: true
          path: |
            ./.evidtrail/commit-stream.json
            ./.evidtrail/metrics.json
            ./.evidtrail/report.md
